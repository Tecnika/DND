<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - DnD Картакар</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="nav-placeholder"></div>
    
    <div class="container">
        <div class="profile-container">
            <!-- Левая колонка - профиль -->
            <div class="profile-sidebar">
                <div class="avatar-placeholder">
                    🎲
                </div>
                <div class="profile-info">
                    <p><span class="profile-label">Логин:</span> <span id="profileUsername">-</span></p>
                    <p><span class="profile-label">Дата регистрации:</span> <span id="profileDate">-</span></p>
                    <p><span class="profile-label">Роль:</span> <span id="profileRole">-</span></p>
                </div>
            </div>
            
            <!-- Правая колонка - игры -->
            <div class="profile-content">
                <h2>Мои игры</h2>
                <div id="gamesList" class="grid">
                    <div class="empty-state">Загрузка...</div>
                </div>
                <a href="/generate.html" class="btn" style="margin-top: 1rem;">Создать персонажа</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { loadNavigation, requireAuth } from './js/common.js';
        
        await loadNavigation();
        requireAuth();
        
        // Загрузка профиля
        if (auth.currentUser) {
            const userDoc = await getDoc(doc(db, "players", auth.currentUser.uid));
            if (userDoc.exists()) {
                const userData = userDoc.data();
                document.getElementById('profileUsername').textContent = userData.username;
                document.getElementById('profileDate').textContent = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString('ru-RU') : 'Неизвестно';
                document.getElementById('profileRole').textContent = userData.role === 'admin' ? 'Администратор' : (userData.role === 'master' ? 'Мастер' : 'Игрок');
            }
            
            // Загрузка персонажей
            const q = query(collection(db, "characters"), where("uid", "==", auth.currentUser.uid));
            const snapshot = await getDocs(q);
            const gamesContainer = document.getElementById('gamesList');
            
            if (snapshot.empty) {
                gamesContainer.innerHTML = '<div class="empty-state">У вас пока нет персонажей</div>';
            } else {
                let html = '';
                snapshot.forEach(doc => {
                    const char = doc.data();
                    html += `
                        <div class="game-card">
                            <h3>${char.name}</h3>
                            <p>${char.race || '?'} | ${char.class || '?'} | Уровень ${char.level || 1}</p>
                        </div>
                    `;
                });
                gamesContainer.innerHTML = html;
            }
        }
    </script>
</body>
</html>
